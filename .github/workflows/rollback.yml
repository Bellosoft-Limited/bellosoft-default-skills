name: Production Rollback

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client to rollback"
        required: true
        type: choice
        options:
          - amibacom
          - enreach
          - release
      rollback_to:
        description: "Rollback strategy"
        required: true
        type: choice
        options:
          - previous
          - specific-tag
        default: previous
      specific_tag:
        description: "Specific tag to rollback to (e.g., amibacom-abc123, leave empty if using previous)"
        required: false
        type: string
      vm_host:
        description: "Proxmox VM host IP (e.g., 192.168.100.10)"
        required: true
        type: string
      confirm:
        description: 'Type "ROLLBACK" to confirm'
        required: true
        type: string

env:
  REGISTRY: registry.bellosoft.dev
  IMAGE_NAME: ca3

jobs:
  validate-rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "ROLLBACK" ]; then
            echo "❌ Confirmation failed. You must type 'ROLLBACK' to proceed."
            exit 1
          fi
          echo "✅ Rollback confirmed"

  backup-current:
    runs-on: ubuntu-latest
    needs: validate-rollback
    outputs:
      current_api_tag: ${{ steps.get-current.outputs.api_tag }}
      current_web_tag: ${{ steps.get-current.outputs.web_tag }}

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ inputs.vm_host }} >> ~/.ssh/known_hosts

      - name: Get current image tags
        id: get-current
        run: |
          API_TAG=$(ssh root@${{ inputs.vm_host }} "cd /opt/ca3 && docker inspect ca3-api-${{ inputs.client }} --format='{{.Config.Image}}' | cut -d':' -f2")
          WEB_TAG=$(ssh root@${{ inputs.vm_host }} "cd /opt/ca3 && docker inspect ca3-web-${{ inputs.client }} --format='{{.Config.Image}}' | cut -d':' -f2")

          echo "api_tag=$API_TAG" >> $GITHUB_OUTPUT
          echo "web_tag=$WEB_TAG" >> $GITHUB_OUTPUT

          echo "📦 Current API tag: $API_TAG"
          echo "📦 Current Web tag: $WEB_TAG"

      - name: Create backup manifest
        run: |
          cat > backup-manifest.json << EOF
          {
            "client": "${{ inputs.client }}",
            "vm_host": "${{ inputs.vm_host }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "rollback_initiated_by": "${{ github.actor }}",
            "current_images": {
              "api": "${{ steps.get-current.outputs.api_tag }}",
              "web": "${{ steps.get-current.outputs.web_tag }}"
            }
          }
          EOF
          cat backup-manifest.json

      - name: Upload backup manifest
        uses: actions/upload-artifact@v4
        with:
          name: rollback-backup-${{ inputs.client }}-${{ github.run_id }}
          path: backup-manifest.json
          retention-days: 90

  rollback:
    runs-on: ubuntu-latest
    needs: backup-current

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ inputs.vm_host }} >> ~/.ssh/known_hosts

      - name: Determine rollback tag
        id: rollback-tag
        run: |
          if [ "${{ inputs.rollback_to }}" == "specific-tag" ]; then
            if [ -z "${{ inputs.specific_tag }}" ]; then
              echo "❌ Specific tag is required when using specific-tag strategy"
              exit 1
            fi
            TAG="${{ inputs.specific_tag }}"
          else
            # Get previous tag from GHCR
            TAG="${{ inputs.client }}"
          fi

          echo "target_tag=$TAG" >> $GITHUB_OUTPUT
          echo "🎯 Rollback target tag: $TAG"

      - name: Log in to Zot Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: admin
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Verify target images exist
        run: |
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-api:${{ steps.rollback-tag.outputs.target_tag }} || {
            echo "❌ API image with tag ${{ steps.rollback-tag.outputs.target_tag }} not found in registry"
            exit 1
          }
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-web:${{ steps.rollback-tag.outputs.target_tag }} || {
            echo "❌ Web image with tag ${{ steps.rollback-tag.outputs.target_tag }} not found in registry"
            exit 1
          }
          echo "✅ Target images verified in registry"

      - name: Copy docker-compose file to VM
        run: |
          scp _source/docker-compose.${{ inputs.client }}.yml root@${{ inputs.vm_host }}:/opt/ca3/docker-compose.yml

      - name: Perform rollback
        run: |
          ssh root@${{ inputs.vm_host }} << 'EOF'
            cd /opt/ca3
            
            # Set environment variables
            export GITHUB_REPOSITORY=${{ github.repository }}
            
            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Stop current containers
            docker-compose stop
            
            # Update docker-compose to use specific tag
            sed -i 's|image: ghcr.io/${GITHUB_REPOSITORY}/ca3-api:${{ inputs.client }}|image: ghcr.io/${{ github.repository }}/ca3-api:${{ steps.rollback-tag.outputs.target_tag }}|g' docker-compose.yml
            sed -i 's|image: ghcr.io/${GITHUB_REPOSITORY}/ca3-web:${{ inputs.client }}|image: ghcr.io/${{ github.repository }}/ca3-web:${{ steps.rollback-tag.outputs.target_tag }}|g' docker-compose.yml
            
            # Pull rollback images
            docker-compose pull
            
            # Start with rollback images
            docker-compose up -d
            
            echo "✅ Rollback deployment initiated"
          EOF

      - name: Wait for services to start
        run: |
          echo "⏳ Waiting 45 seconds for services to start..."
          sleep 45

      - name: Verify rollback health
        id: health-check
        run: |
          ssh root@${{ inputs.vm_host }} << 'EOF'
            cd /opt/ca3
            
            # Check container status
            docker-compose ps
            
            # Check API health
            API_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")
            
            # Check Web health
            WEB_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/health || echo "000")
            
            echo "API Health: $API_HEALTH"
            echo "Web Health: $WEB_HEALTH"
            
            if [ "$API_HEALTH" != "200" ] || [ "$WEB_HEALTH" != "200" ]; then
              echo "❌ Health check failed!"
              exit 1
            fi
            
            echo "✅ Health checks passed"
          EOF

      - name: Create rollback summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Rollback Summary 🔄

          **Client**: ${{ inputs.client }}
          **VM Host**: ${{ inputs.vm_host }}
          **Rollback Strategy**: ${{ inputs.rollback_to }}
          **Target Tag**: ${{ steps.rollback-tag.outputs.target_tag }}
          **Initiated By**: ${{ github.actor }}
          **Timestamp**: $(date -u)

          ### Previous State (Backed Up)
          - API: `${{ needs.backup-current.outputs.current_api_tag }}`
          - Web: `${{ needs.backup-current.outputs.current_web_tag }}`

          ### New State (Rolled Back To)
          - API: `${{ steps.rollback-tag.outputs.target_tag }}`
          - Web: `${{ steps.rollback-tag.outputs.target_tag }}`

          ### Health Check
          ${{ steps.health-check.outcome == 'success' && '✅ Passed' || '❌ Failed' }}

          ### Backup Artifact
          Download backup manifest from artifacts to restore to previous state if needed.
          EOF

  rollback-failed:
    runs-on: ubuntu-latest
    needs: [backup-current, rollback]
    if: failure()

    steps:
      - name: Attempt automatic recovery
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ inputs.vm_host }} >> ~/.ssh/known_hosts

          ssh root@${{ inputs.vm_host }} << 'EOF'
            cd /opt/ca3
            
            echo "🔄 Attempting to restore previous state..."
            
            # Restore previous images
            sed -i 's|image: ghcr.io/.*/ca3-api:.*|image: ghcr.io/${{ github.repository }}/ca3-api:${{ needs.backup-current.outputs.current_api_tag }}|g' docker-compose.yml
            sed -i 's|image: ghcr.io/.*/ca3-web:.*|image: ghcr.io/${{ github.repository }}/ca3-web:${{ needs.backup-current.outputs.current_web_tag }}|g' docker-compose.yml
            
            docker-compose up -d
            
            echo "✅ Attempted recovery to previous state"
          EOF

      - name: Notify failure
        run: |
          echo "## ⚠️ Rollback Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Rollback failed and automatic recovery was attempted." >> $GITHUB_STEP_SUMMARY
          echo "Please check the VM manually and review logs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Client**: ${{ inputs.client }}" >> $GITHUB_STEP_SUMMARY
          echo "**VM Host**: ${{ inputs.vm_host }}" >> $GITHUB_STEP_SUMMARY
