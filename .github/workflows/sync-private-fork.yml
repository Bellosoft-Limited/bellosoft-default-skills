name: Sync private fork

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push master to bellosoft-default-skills-private
        env:
          SSH_KEY: ${{ secrets.PRIVATE_FORK_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          git remote add private-fork git@github.com:Bellosoft-Limited/bellosoft-default-skills-private.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" git push private-fork HEAD:master
