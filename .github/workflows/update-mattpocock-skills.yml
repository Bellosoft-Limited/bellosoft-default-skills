name: Update Matt Pocock skills

# Opens (or refreshes) a PR when mattpocock/skills has a new release.
# Nothing is merged automatically: review the diff and merge when ready.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag, branch or commit (blank = latest release tag)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # .github/ is synced into every Bellosoft project; only run in this repo.
    if: github.repository == 'Bellosoft-Limited/bellosoft-default-skills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy upstream skills
        id: vendor
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          LOCK=.claude/vendor/mattpocock-skills/upstream.json
          OLD_COMMIT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$LOCK")
          bash scripts/update-mattpocock-skills.sh "$REF"
          NEW_COMMIT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$LOCK")
          NEW_REF=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ref"])' "$LOCK")
          echo "ref=$NEW_REF" >> "$GITHUB_OUTPUT"
          echo "compare=https://github.com/mattpocock/skills/compare/${OLD_COMMIT}...${NEW_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-mattpocock-skills
          delete-branch: true
          commit-message: "chore: update Matt Pocock skills to ${{ steps.vendor.outputs.ref }}"
          title: "chore: update Matt Pocock skills to ${{ steps.vendor.outputs.ref }}"
          body: |
            Updates the copied [mattpocock/skills](https://github.com/mattpocock/skills) to `${{ steps.vendor.outputs.ref }}`.

            - Upstream changes: ${{ steps.vendor.outputs.compare }}
            - Upstream changelog: https://github.com/mattpocock/skills/blob/main/CHANGELOG.md

            Before merging, check:
            - [ ] No skill we rely on was removed or renamed (see `upstream.json`).
            - [ ] `to-spec`, `to-tickets`, `triage` and `wayfinder` still expect the tracker operations our Jira file (`bellosoft-jira/references/matt-issue-tracker-jira.md`) provides.

            Generated by `.github/workflows/update-mattpocock-skills.yml`.
