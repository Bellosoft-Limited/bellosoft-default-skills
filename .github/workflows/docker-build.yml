name: Build Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.bellosoft.dev
  IMAGE_NAME: ca3

jobs:
  build-production:
    runs-on: [ self-hosted, Linux, X64, ca3-build-runner ]
    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        client:
          - name: amibacom
            api_solution: CA3-Amibacom-Api.sln
            web_solution: CA3-Amibacom-Web.sln
          - name: enreach
            api_solution: CA3-Enreach-Api.sln
            web_solution: CA3-Enreach-Web.sln
          - name: westerntrust
            api_solution: CA3-WesternTrust-Api.sln
            web_solution: CA3-WesternTrust-Web.sln
          - name: release
            api_solution: CA3-Release-Api.sln
            web_solution: CA3-Release-Web.sln

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Zot Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: admin
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Generate version tags
        id: version
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          BUILD_VERSION="${BUILD_DATE}-${{ github.run_number }}"
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${BUILD_VERSION}"

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-api
          tags: |
            type=raw,value=${{ matrix.client.name }}-${{ steps.version.outputs.version }}
            type=raw,value=${{ matrix.client.name }}-latest
            type=raw,value=${{ matrix.client.name }}

      - name: Extract metadata for Web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-web
          tags: |
            type=raw,value=${{ matrix.client.name }}-${{ steps.version.outputs.version }}
            type=raw,value=${{ matrix.client.name }}-latest
            type=raw,value=${{ matrix.client.name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./_source/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            BUILD_SOLUTION=${{ matrix.client.api_solution }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.client.name }}-api
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.client.name
            }}-api-new,mode=max
          provenance: false
          sbom: false

      - name: Update API Cache
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.client.name }}-api
          mv /tmp/.buildx-cache-${{ matrix.client.name }}-api-new /tmp/.buildx-cache-${{ matrix.client.name }}-api

      - name: Build and push Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./_source/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            BUILD_SOLUTION=${{ matrix.client.web_solution }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.client.name }}-web
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.client.name
            }}-web-new,mode=max
          provenance: false
          sbom: false

      - name: Update Web Cache
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.client.name }}-web
          mv /tmp/.buildx-cache-${{ matrix.client.name }}-web-new /tmp/.buildx-cache-${{ matrix.client.name }}-web

      - name: Image digest
        run: |
          echo "API Image: ${{ steps.meta-api.outputs.tags }}"
          echo "Web Image: ${{ steps.meta-web.outputs.tags }}"

  deploy-uat:
    runs-on: [ self-hosted, Linux, X64, ca3-uat ]
    needs: build-production
    if: success()
    environment: uat

    steps:
      - name: Stop existing containers
        run: |
          cd _source 2>/dev/null || true
          CLIENT=release docker compose down 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dotenvx
        run: |
          mkdir -p $HOME/.local/bin
          curl -sfS "https://dotenvx.sh?directory=$HOME/.local/bin" | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Decrypt environment file
        run: |
          cd _source
          export DOTENV_PRIVATE_KEY_UAT="${{ secrets.DOTENV_PRIVATE_KEY_UAT }}"
          dotenvx decrypt --stdout -f .env.uat > .env

      - name: Set environment variables
        run: |
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> $GITHUB_ENV
          echo "DOTENV_PRIVATE_KEY_UAT=${{ secrets.DOTENV_PRIVATE_KEY_UAT }}" >> $GITHUB_ENV

      - name: Log in to Zot Registry
        run: echo "${{ secrets.ZOT_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u
          admin --password-stdin

      - name: Deploy UAT environment
        run: |
          cd _source

          # Set environment variables
          export CLIENT=release
          export ENVIRONMENT=Production
          export DOTENV_PRIVATE_KEY="${{ secrets.DOTENV_PRIVATE_KEY_UAT }}"

          # Pull latest release images
          docker compose pull

          # Restart containers with zero downtime
          docker compose up -d --force-recreate --no-deps
                    

          # Clean up old images
          docker image prune -f

          echo "✅ UAT deployment completed"

      - name: Verify deployment
        run: |
          cd _source

          # Wait for health checks
          sleep 30

          # Check container status
          CLIENT=release docker compose ps

          # Check API health
          curl -f http://localhost:8080/health || echo "⚠️ API health check failed"

          # Check Web health
          curl -f http://localhost:8081/health || echo "⚠️ Web health check failed"

      - name: Deployment summary
        run: |
          echo "### UAT Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: UAT" >> $GITHUB_STEP_SUMMARY
          echo "- **API Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-api:release" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-web:release" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
