name: Deploy to Production
run-name: "Deploy to Production: ${{ inputs.client }}"

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client to deploy"
        required: true
        type: choice
        options:
          - amibacom
          - enreach
          - release
          - talktalk
          - westerntrust
          - magnet

env:
  REGISTRY: registry.bellosoft.dev
  IMAGE_NAME: ca3

jobs:
  deploy:
    runs-on: [ self-hosted, Linux, X64, "${{ inputs.client }}" ]
    environment: production

    steps:
      - name: Stop existing containers
        run: |
          cd _source 2>/dev/null || true
          CLIENT=${{ inputs.client }} docker compose down 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dotenvx
        run: |
          mkdir -p $HOME/.local/bin
          curl -sfS "https://dotenvx.sh?directory=$HOME/.local/bin" | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Decrypt environment file
        run: |
          cd _source
          CLIENT_UPPER=$(echo "${{ inputs.client }}" | tr '[:lower:]' '[:upper:]')
          export DOTENV_PRIVATE_KEY_${CLIENT_UPPER}="${{ secrets[format('DOTENV_PRIVATE_KEY_{0}', inputs.client)] }}"
          dotenvx decrypt --stdout -f .env.${{ inputs.client }} > .env

      - name: Deploy containers
        run: |
          cd _source

          # Determine image tag based on client
          if [[ "${{ inputs.client }}" == "amibacom" || "${{ inputs.client }}" == "enreach" || "${{ inputs.client }}" == "westerntrust" ]]; then
            IMAGE_TAG="${{ inputs.client }}"
          elif [[ "${{ inputs.client }}" == "magnet" ]]; then
            IMAGE_TAG="amibacom"
          else
            IMAGE_TAG="release"
          fi

          # Set environment variables
          export CLIENT=${IMAGE_TAG}
          export ENVIRONMENT=Production
          export DOTENV_PRIVATE_KEY="${{ secrets[format('DOTENV_PRIVATE_KEY_{0}', inputs.client)] }}"

          # Login to GitHub Container Registry
          echo "${{ secrets.ZOT_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u admin --password-stdin

          # Pull latest images
          docker compose pull

          # Restart containers with zero downtime
          docker compose up -d --force-recreate --no-deps

          # Clean up old images
          docker image prune -f

          echo "Deployment completed successfully for ${{ inputs.client }} using ${IMAGE_TAG} images"

      - name: Verify deployment
        run: |
          cd _source
          CLIENT=${{ inputs.client }} docker compose ps

          # Wait for health checks
          sleep 30

          # Check API health
          curl -f http://localhost:8080/health || echo "API health check failed"

          # Check Web health
          curl -f http://localhost:8081/health || echo "Web health check failed"

      - name: Deployment summary
        run: |
          # Determine image tag based on client
          if [[ "${{ inputs.client }}" == "amibacom" || "${{ inputs.client }}" == "enreach" ]]; then
            IMAGE_TAG="${{ inputs.client }}"
          else
            IMAGE_TAG="release"
          fi

          echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Client**: ${{ inputs.client }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: ${{ runner.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-api:${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-web:${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
