name: PR Validation

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

env:
  REGISTRY: registry.bellosoft.dev
  IMAGE_NAME: ca3

jobs:
  validate-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./_source/Dockerfile.api
          push: false
          tags: ca3-api:pr-${{ github.event.pull_request.number }}
          build-args: |
            BUILD_SOLUTION=CA3-PrBuild-Api.sln
          cache-from: type=gha,scope=pr-api

      - name: Build Web Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./_source/Dockerfile.web
          push: false
          tags: ca3-web:pr-${{ github.event.pull_request.number }}
          build-args: |
            BUILD_SOLUTION=CA3-PrBuild-Web.sln
          cache-from: type=gha,scope=pr-web

      - name: Build success comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Docker builds** succeeded for API and Web'
            })

      - name: Build failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Docker builds** failed. Check the logs for details.'
            })

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore _source/CA3.sln

      - name: Build solution
        run: dotnet build _source/CA3.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test _source/CA3.sln --configuration Release --no-build --verbosity normal --logger trx
        continue-on-error: true

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: .NET Tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
          fail-on-error: false

      - name: Comment PR with test results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '⚠️';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} Tests completed. Check the [test report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            })

  pr-summary:
    runs-on: ubuntu-latest
    needs: [validate-build, lint-and-test]
    if: always()

    steps:
      - name: PR Summary
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ needs.validate-build.result }}';
            const testResult = '${{ needs.lint-and-test.result }}';

            const buildStatus = buildResult === 'success' ? '✅' : '❌';
            const testStatus = testResult === 'success' ? '✅' : '⚠️';

            const summary = `
            ## PR Validation Summary

            | Check | Status |
            |-------|--------|
            | Docker Builds | ${buildStatus} ${buildResult} |
            | Tests | ${testStatus} ${testResult} |

            ${buildResult === 'success' && testResult === 'success' ? '✅ All checks passed! This PR is ready for review.' : '⚠️ Some checks failed. Please review the logs above.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })
