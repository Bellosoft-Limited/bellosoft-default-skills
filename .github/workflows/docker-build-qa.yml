name: Build and Deploy QA

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.bellosoft.dev
  IMAGE_NAME: ca3

jobs:
  build-qa:
    runs-on: [self-hosted, Linux, X64, ca3-build-runner]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Zot Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: admin
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Generate version tags
        id: version
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          BUILD_VERSION="${BUILD_DATE}-${{ github.run_number }}"
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${BUILD_VERSION}"

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-api
          tags: |
            type=raw,value=qa-${{ steps.version.outputs.version }}
            type=raw,value=qa-latest
            type=raw,value=qa

      - name: Extract metadata for Web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-web
          tags: |
            type=raw,value=qa-${{ steps.version.outputs.version }}
            type=raw,value=qa-latest
            type=raw,value=qa

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./_source/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            BUILD_SOLUTION=CA3-Qa-Api.sln
          cache-from: type=local,src=/tmp/.buildx-cache-qa-api
          cache-to: type=local,dest=/tmp/.buildx-cache-qa-api-new,mode=max
          provenance: false
          sbom: false

      - name: Update API Cache
        run: |
          rm -rf /tmp/.buildx-cache-qa-api
          mv /tmp/.buildx-cache-qa-api-new /tmp/.buildx-cache-qa-api

      - name: Build and push Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./_source/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            BUILD_SOLUTION=CA3-Qa-Web.sln
          cache-from: type=local,src=/tmp/.buildx-cache-qa-web
          cache-to: type=local,dest=/tmp/.buildx-cache-qa-web-new,mode=max
          provenance: false
          sbom: false

      - name: Update Web Cache
        run: |
          rm -rf /tmp/.buildx-cache-qa-web
          mv /tmp/.buildx-cache-qa-web-new /tmp/.buildx-cache-qa-web

      - name: Final Cleanup
        if: always()
        run: |
          # Clean orphan containers
          docker system prune -f --volumes
          # Clean Buildx cache not used in the last 24h
          docker builder prune -f --filter "until=24h"

  deploy-qa:
    runs-on: [self-hosted, Linux, X64, ca3-qa]
    needs: build-qa
    if: success()
    environment: qa

    steps:
      - name: Stop existing containers
        run: |
          cd _source 2>/dev/null || true
          CLIENT=qa docker compose down 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dotenvx
        run: |
          mkdir -p $HOME/.local/bin
          curl -sfS "https://dotenvx.sh?directory=$HOME/.local/bin" | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Decrypt environment file
        run: |
          cd _source
          export DOTENV_PRIVATE_KEY_QA="${{ secrets.DOTENV_PRIVATE_KEY_QA }}"
          dotenvx decrypt --stdout -f .env.qa > .env

      - name: Set environment variables
        run: |
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> $GITHUB_ENV
          echo "DOTENV_PRIVATE_KEY_QA=${{ secrets.DOTENV_PRIVATE_KEY_QA }}" >> $GITHUB_ENV

      - name: Log in to Zot Registry
        run: echo "${{ secrets.ZOT_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u admin --password-stdin

      - name: Deploy QA environment
        run: |
          cd _source

          # Set environment variables
          export CLIENT=qa
          export ENVIRONMENT=Staging
          export DOTENV_PRIVATE_KEY="${{ secrets.DOTENV_PRIVATE_KEY_QA }}"

          # Pull latest QA images
          docker compose pull

          # Restart containers with zero downtime
          docker compose up -d --force-recreate --no-deps
                    

          # Clean up old images
          docker image prune -f

          echo "✅ QA deployment completed"

      - name: Verify deployment
        run: |
          cd _source

          # Wait for health checks
          sleep 30

          # Check container status
          CLIENT=qa docker compose ps

          # Check API health
          curl -f http://localhost:8080/health || echo "⚠️ API health check failed"

          # Check Web health
          curl -f http://localhost:8081/health || echo "⚠️ Web health check failed"

      - name: Deployment summary
        run: |
          echo "### QA Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: QA" >> $GITHUB_STEP_SUMMARY
          echo "- **API Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-api:qa" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ca3-web:qa" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
