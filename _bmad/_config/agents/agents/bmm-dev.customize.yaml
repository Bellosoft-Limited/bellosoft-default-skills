# Agent Customization
# Customize any section below - all are optional

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - |
    GITHUB + PLANE FLOW — Mandatory integration for every story execution:

    STEP 4 EXTENSION (after marking story in-progress, BEFORE starting implementation):
    Load `.github/skills/bellosoft-github/SKILL.md` then `workflow.md`.
    Run GITHUB_BRANCH for the current story.
    This creates the Plane-compatible branch (e.g. feature/NOKEY-42-slug) before any
    code is written. If the user is already on a correctly-named branch, confirm it
    and proceed silently. Never skip this step.

    STEP 9 EXTENSION (after all tasks are [x] and build passes, BEFORE setting status "review"):
    1. Run GITHUB_COMMIT — stage all changes, ask for commit type, commit with format
       {type}(NOKEY-XX): {description} referencing the Plane ticket.
    2. Run GITHUB_PR — create PR via gh CLI with title [NOKEY-XX] {story_title}.
       The [brackets] activate Plane state automation: when the PR is merged, Plane
       automatically moves the work item to Done.
    3. Only after PR is created, update story status to "review" and sprint-status.yaml.

# Add persistent memories for the agent
memories:
  - "GitHub+Plane flow is mandatory for every story: run GITHUB_BRANCH (step 4) before implementation, GITHUB_COMMIT then GITHUB_PR (step 9) before marking review."
  - "Branch format: {type}/{NOKEY-XX}-{slug} | Commit: {type}(NOKEY-XX): {desc} | PR title: [NOKEY-XX] {title} — brackets required for Plane state automation."
  - "Never force-push, never use --no-verify, never commit .env files with real keys."
  - "PR title MUST use [NOKEY-XX] WITH brackets — without brackets Plane only links but does NOT auto-transition the work item state."

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu:
  - trigger: github-branch
    action: "#github-branch-action"
    description: Create Plane-compatible git branch for current story (feature/NOKEY-XX-slug)
  - trigger: github-commit
    action: "#github-commit-action"
    description: Stage & commit with Plane-linked conventional commit (feat(NOKEY-XX):...)
  - trigger: github-pr
    action: "#github-pr-action"
    description: Open PR with [NOKEY-XX] bracket format to activate Plane state automation

# Add custom prompts (for action="#id" handlers)
prompts:
  - id: github-branch-action
    content: |
      Load `.github/skills/bellosoft-github/SKILL.md` then `workflow.md`. Run GITHUB_BRANCH for the current story.
  - id: github-commit-action
    content: |
      Load `.github/skills/bellosoft-github/SKILL.md` then `workflow.md`. Run GITHUB_COMMIT.
  - id: github-pr-action
    content: |
      Load `.github/skills/bellosoft-github/SKILL.md` then `workflow.md`. Run GITHUB_PR.
